<style>
:root { color-scheme: light; --bg:#fbf7ee; --card:#fffdf8; --text:#3a2a1f; --text-2:#5b4736; --text-3:#8d7663; --accent:#3b4ea8; --sand:#fbecc4; }
body { margin:0; color:var(--text-2); font:400 16.5px/1.72 'Zen Maru Gothic','Hiragino Maru Gothic ProN',system-ui,sans-serif;
  background: radial-gradient(1200px 500px at 85% -10%, #fbe6b9 0%, transparent 60%), radial-gradient(900px 400px at -10% 20%, #fde3d3 0%, transparent 55%), var(--bg); background-color:var(--bg); min-height:100vh; }
.nav { border-bottom:2px solid var(--text); }
.nav div { max-width:42rem; margin:0 auto; padding:0.7rem 1.25rem; font:500 14px/1.4 'M PLUS 1 Code',ui-monospace,monospace; }
.nav a { color:var(--text); text-decoration:none; }
main { max-width:42rem; margin:0 auto; padding:2.5rem 1.25rem; }
h1 { font-family:'Klee One','Zen Maru Gothic',cursive; font-weight:600; font-size:2.4rem; color:var(--text); margin:0 0 1.5rem; padding-bottom:0.4rem; border-bottom:2px solid var(--text); }
ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:1rem; }
li { padding:1rem 1.2rem; border:2px solid var(--text); border-radius:4px; background:var(--card); }
a { color:var(--accent); font-weight:700; text-decoration-style:wavy; text-decoration-thickness:1px; text-underline-offset:0.2em; }
p { margin:0.3rem 0 0; }
